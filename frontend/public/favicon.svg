<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1322" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#030508" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- High-contrast rounded squircle background (stands out on both dark and light browser tabs) -->
  <rect width="512" height="512" rx="116" fill="url(#favBg)" />
  <rect width="496" height="496" x="8" y="8" rx="108" fill="none" stroke="#00f2fe" stroke-width="8" stroke-opacity="0.25" />

  <!-- Padlock Shackle (Arch) -->
  <path d="M 186 240 L 186 172 C 186 133.3 217.3 102 256 102 C 294.7 102 326 133.3 326 172 L 326 240"
        fill="none"
        stroke="url(#favCyan)"
        stroke-width="44"
        stroke-linecap="round"
        filter="url(#favGlow)" />

  <!-- Padlock Body -->
  <rect x="136" y="226" width="240" height="190" rx="36" fill="#0f1f35" stroke="url(#favCyan)" stroke-width="12" />
  <!-- Inner Body Plate -->
  <rect x="146" y="236" width="220" height="170" rx="28" fill="#070e1a" />

  <!-- Central Network Core (Distributed Keyhole) -->
  <circle cx="256" cy="305" r="26" fill="url(#favCyan)" filter="url(#favGlow)" />

  <!-- Distributed Graph Nodes & Interconnects -->
  <line x1="256" y1="305" x2="196" y2="362" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <line x1="256" y1="305" x2="316" y2="362" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" opacity="0.85" />
  <line x1="256" y1="305" x2="256" y2="366" stroke="#00f2fe" stroke-width="8" stroke-linecap="round" opacity="0.85" />

  <!-- Satellite Node Circles -->
  <circle cx="196" cy="362" r="15" fill="#38bdf8" />
  <circle cx="256" cy="366" r="15" fill="#10b981" />
  <circle cx="316" cy="362" r="15" fill="#38bdf8" />
</svg>
