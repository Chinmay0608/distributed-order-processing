<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Crisp Blue / Emerald accents -->
    <linearGradient id="favShackle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Deep Slate Squircle Background (high contrast on dark and light browser tabs) -->
  <rect width="512" height="512" rx="112" fill="#0b101b" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#1e293b" stroke-width="6" />

  <!-- Padlock Shackle (Arch) -->
  <path d="M 186 240 L 186 172 C 186 133.3 217.3 102 256 102 C 294.7 102 326 133.3 326 172 L 326 240"
        fill="none"
        stroke="url(#favShackle)"
        stroke-width="44"
        stroke-linecap="round" />

  <!-- Padlock Body -->
  <rect x="136" y="226" width="240" height="190" rx="32" fill="#111827" stroke="#1e293b" stroke-width="8" />
  <!-- Inner Body Plate -->
  <rect x="150" y="240" width="212" height="162" rx="24" fill="#080c14" />

  <!-- Central Network Core (Distributed Keyhole) -->
  <circle cx="256" cy="305" r="24" fill="#38bdf8" />

  <!-- Distributed Graph Nodes & Interconnects -->
  <line x1="256" y1="305" x2="196" y2="362" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="305" x2="316" y2="362" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  <line x1="256" y1="305" x2="256" y2="366" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- Satellite Node Circles -->
  <circle cx="196" cy="362" r="14" fill="#38bdf8" />
  <circle cx="256" cy="366" r="14" fill="#10b981" />
  <circle cx="316" cy="362" r="14" fill="#38bdf8" />
</svg>
