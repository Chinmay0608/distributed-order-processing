<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;display=swap');

      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
      .sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      
      .card-shadow {
        filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.55)) drop-shadow(0 1px 3px rgba(0, 0, 0, 0.4));
      }
      .cta-shadow {
        filter: drop-shadow(0 4px 14px rgba(37, 99, 235, 0.35));
      }
    </style>

    <!-- Subtle ambient canvas gradients -->
    <linearGradient id="bgCanvas" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <!-- Card Background -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111a2e" />
      <stop offset="100%" stop-color="#0b111e" />
    </linearGradient>

    <!-- Subtle Dot Grid -->
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.35" />
    </pattern>

    <!-- Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- 1. Canvas Background -->
  <rect width="1200" height="630" fill="url(#bgCanvas)" />
  <rect width="1200" height="630" fill="url(#dotGrid)" />

  <!-- Soft subtle radial light at top center -->
  <radialGradient id="topGlow" cx="50%" cy="0%" r="50%">
    <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.18" />
    <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0" />
  </radialGradient>
  <rect width="1200" height="300" fill="url(#topGlow)" />

  <!-- ========================================================================= -->
  <!-- HERO HEADER (Centered, Spacious, Punchy) -->
  <!-- ========================================================================= -->

  <!-- Pill Badge -->
  <g transform="translate(485, 52)">
    <rect width="230" height="26" rx="13" fill="#172238" stroke="#253554" stroke-width="1" />
    <circle cx="14" cy="13" r="3.5" fill="#10b981" />
    <text x="26" y="17" fill="#38bdf8" font-size="11" font-weight="600" class="mono" letter-spacing="0.8">DISTRIBUTED SYSTEMS ENGINE</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="122" text-anchor="middle" fill="#f8fafc" font-size="38" font-weight="800" class="sans" letter-spacing="-0.8">
    Distributed Order Processing System
  </text>

  <!-- Subtitle -->
  <text x="600" y="152" text-anchor="middle" fill="#94a3b8" font-size="16" font-weight="400" class="sans">
    High-concurrency ordering platform with Redis distributed locking and zero-overselling guarantee.
  </text>

  <!-- ========================================================================= -->
  <!-- FLOATING PREVIEW SHOWCASE CARD (High clarity, Normal UI, Zero clutter) -->
  <!-- ========================================================================= -->
  <g transform="translate(175, 185)" class="card-shadow">
    <!-- Card Frame -->
    <rect width="850" height="280" rx="12" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1" />

    <!-- Card Title Bar -->
    <rect width="850" height="38" rx="12" fill="#0b101c" />
    <rect y="26" width="850" height="12" fill="#0b101c" />
    <line x1="0" y1="38" x2="850" y2="38" stroke="#1e293b" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="22" cy="19" r="4.5" fill="#ef4444" fill-opacity="0.8" />
    <circle cx="37" cy="19" r="4.5" fill="#f59e0b" fill-opacity="0.8" />
    <circle cx="52" cy="19" r="4.5" fill="#10b981" fill-opacity="0.8" />

    <!-- Tab / Breadcrumb -->
    <text x="75" y="23" fill="#94a3b8" font-size="12" font-weight="500" class="mono">
      telemetry-console &gt; simulation-bench &gt; 50-buyer-rush
    </text>

    <!-- Cluster Status Tag -->
    <rect x="715" y="9" width="115" height="20" rx="4" fill="#0f291e" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.4" />
    <circle cx="727" cy="19" r="3" fill="#10b981" />
    <text x="736" y="23" fill="#34d399" font-size="10" font-weight="600" class="mono">LIVE CLUSTER</text>

    <!-- Card Interior Content -->
    <!-- LEFT HALF: The Concurrency Rush Scenario -->
    <g transform="translate(32, 60)">
      <text x="0" y="0" fill="#64748b" font-size="11" font-weight="700" class="mono" letter-spacing="0.5">
        CONCURRENT STRESS SIMULATION
      </text>

      <!-- Rush Scenario Box -->
      <g transform="translate(0, 14)">
        <rect width="390" height="84" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
        
        <!-- Icon & Tag -->
        <text x="16" y="28" fill="#f1f5f9" font-size="15" font-weight="700" class="sans">
          ⚡ 50 Concurrent Orders
        </text>
        <rect x="275" y="14" width="98" height="18" rx="3" fill="#1e293b" />
        <text x="324" y="26" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600" class="mono">BURST TRAFFIC</text>

        <!-- Product Details -->
        <text x="16" y="52" fill="#94a3b8" font-size="12" class="mono">
          Target: iPhone 15 Pro
        </text>
        <text x="210" y="52" fill="#e2e8f0" font-size="12" font-weight="600" class="mono">
          Available Stock: 10
        </text>

        <text x="16" y="70" fill="#64748b" font-size="11" class="mono">
          Concurrency Lock: Redis Redlock (TTL: 5s)
        </text>
      </g>

      <!-- Outcome Banner -->
      <g transform="translate(0, 110)">
        <rect width="390" height="42" rx="6" fill="#08281e" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
        <circle cx="20" cy="21" r="5" fill="#10b981" />
        <text x="34" y="25" fill="#34d399" font-size="12" font-weight="700" class="mono">
          10 Orders Placed  ·  40 Gracefully Rejected
        </text>
      </g>

      <text x="0" y="174" fill="#64748b" font-size="11" class="mono">
        Guaranteed: Remaining inventory = 0 (No overselling)
      </text>
    </g>

    <!-- VERTICAL DIVIDER -->
    <line x1="465" y1="56" x2="465" y2="256" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />

    <!-- RIGHT HALF: Core System Guarantees & KPIs -->
    <g transform="translate(500, 60)">
      <text x="0" y="0" fill="#64748b" font-size="11" font-weight="700" class="mono" letter-spacing="0.5">
        SYSTEM GUARANTEES &amp; TELEMETRY
      </text>

      <!-- Metric 1: Zero Overselling -->
      <g transform="translate(0, 14)">
        <rect width="318" height="54" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="600" class="mono">OVERSELLING RATE</text>
        <text x="16" y="44" fill="#38bdf8" font-size="20" font-weight="800" class="mono">0 ITEMS</text>
        <text x="135" y="42" fill="#94a3b8" font-size="11" class="sans">Strict single-winner lock</text>
      </g>

      <!-- Metric 2: Lock Latency -->
      <g transform="translate(0, 78)">
        <rect width="318" height="54" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="22" fill="#64748b" font-size="10" font-weight="600" class="mono">AVG LOCK ACQUISITION</text>
        <text x="16" y="44" fill="#10b981" font-size="20" font-weight="800" class="mono">1.8 ms</text>
        <text x="135" y="42" fill="#94a3b8" font-size="11" class="sans">Sub-millisecond Redis I/O</text>
      </g>

      <!-- Metric 3: Kafka Streaming -->
      <g transform="translate(0, 142)">
        <rect width="318" height="42" rx="8" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
        <text x="16" y="26" fill="#cbd5e1" font-size="11" font-weight="600" class="mono">
          KAFKA PIPELINE: 3 PARTITIONS · 0 LAG
        </text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CALL TO ACTION & STACK BADGES (Bottom Section, Invites Click) -->
  <!-- ========================================================================= -->

  <!-- Interactive CTA Button -->
  <g transform="translate(485, 492)" class="cta-shadow">
    <rect width="230" height="44" rx="22" fill="url(#btnGrad)" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.5" />
    <text x="115" y="27" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700" class="sans" letter-spacing="0.2">
      Explore Live Console  →
    </text>
  </g>

  <!-- Tech Stack Line -->
  <text x="600" y="568" text-anchor="middle" fill="#64748b" font-size="12" font-weight="500" class="mono">
    Spring Boot 3  ·  Redis Distributed Locking  ·  Apache Kafka  ·  MongoDB Saga  ·  React
  </text>
</svg>
